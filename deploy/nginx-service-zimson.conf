# Nginx — service.zimson.net on EC2 (40.192.16.186)
# Certificate (Let's Encrypt, before installing this file):
#          sudo systemctl stop nginx
#          sudo certbot certonly --standalone -d service.zimson.net
#          sudo systemctl start nginx
# Install: sudo cp deploy/nginx-service-zimson.conf /etc/nginx/sites-available/service-zimson
#          sudo ln -sf /etc/nginx/sites-available/service-zimson /etc/nginx/sites-enabled/service-zimson
#          sudo rm -f /etc/nginx/sites-enabled/zimsonwatchcare
#          sudo nginx -t && sudo systemctl reload nginx

upstream zimson_node {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name service.zimson.net;

    ssl_certificate     /etc/letsencrypt/live/service.zimson.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/service.zimson.net/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://zimson_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/media/ {
        proxy_pass http://zimson_node;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://zimson_node;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://zimson_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name service.zimson.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://service.zimson.net$request_uri;
    }
}

# Old domain → new domain (keeps old links in sent emails / WhatsApp working).
server {
    listen 80;
    listen [::]:80;
    server_name zimsonwatchcare.com www.zimsonwatchcare.com;
    return 301 https://service.zimson.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zimsonwatchcare.com www.zimsonwatchcare.com;

    ssl_certificate     /etc/ssl/zimsonwatchcare/fullchain.pem;
    ssl_certificate_key /etc/ssl/zimsonwatchcare/privkey.pem;

    return 301 https://service.zimson.net$request_uri;
}
